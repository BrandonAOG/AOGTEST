<!DOCTYPE html>
<html lang="en">
<head>

<title>Always On Generators - Maintenance Report</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: light;
  --cyan: #D97706;
  --cyan-dim: #B45309;
  --cyan-dark: #92400E;
  --amber: #D97706;
  --amber-dim: #B45309;
  --green: #059669;
  --red: #DC2626;
  --bg: #FFFFFF;
  --bg2: #FFFFFF;
  --bg3: #F8F8F8;
  --bg4: #F0F0F0;
  --panel: #FFFFFF;
  --panel2: #FAFAFA;
  --border: rgba(217,119,6,0.25);
  --border-bright: rgba(217,119,6,0.5);
  --text: #1F2937;
  --text-muted: #6B7280;
  --text-dim: #9CA3AF;
  --glow: 0 0 8px rgba(217,119,6,0.3), 0 0 20px rgba(217,119,6,0.1);
  --font-display: 'Orbitron', monospace;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Exo 2', sans-serif;
  --icon-color-primary: #D97706;
  --icon-color-section: #D97706;

  /* ╔══════════════════════════════════════════════╗
     ║  SECTION 1 — PAGE CHROME                    ║
     ║  Logo, header bar, corner brackets,          ║
     ║  dark/light toggle, action buttons,          ║
     ║  section blocks.                             ║
     ╚══════════════════════════════════════════════╝ */

  /* ── 1a. AOG Logo size ── */
  --logo-size-screen:          36px;   /* logo square on screen — phone                  */
  --logo-size-screen-ipad:     36px;   /* logo square on screen — iPad                   */
  --logo-size-screen-desktop:  36px;   /* logo square on screen — desktop                */
  --logo-size-print:           36px;   /* logo square in PDF — phone                     */
  --logo-size-print-ipad:      36px;   /* logo square in PDF — iPad                      */
  --logo-size-print-desktop:   36px;   /* logo square in PDF — desktop                   */

  /* ── 1b. Page corner brackets ── */
  --corner-size-phone:         24px;   /* decorative L-brackets at page corners — phone  */
  --corner-size-ipad:          24px;   /* — iPad                                         */
  --corner-size-desktop:       24px;   /* — desktop                                      */

  /* ── 1c. Header bar ── */
  --header-min-height-phone:   56px;   /* minimum height of the top header bar — phone   */

  --header-min-height-desktop: 56px;   /* — desktop                                      */
  --header-gap-phone:          8px;    /* gap between elements inside the header — phone */
  --header-gap-ipad:           8px;    /* — iPad                                         */
  --header-gap-desktop:        8px;    /* — desktop                                      */

  --header-logo-pad-ipad:      30px;   /* — iPad                                         */
  --header-logo-pad-desktop:   30px;   /* — desktop                                      */

  /* ── 1d. Dark / Light mode toggle button ── */
  --theme-btn-size-phone:      36px;   /* toggle button width & height — phone           */
  --theme-btn-size-ipad:       36px;   /* — iPad                                         */
  --theme-btn-size-desktop:    36px;   /* — desktop                                      */
  --theme-btn-padding-phone:   5px;    /* padding inside toggle button — phone           */
  --theme-btn-padding-ipad:    5px;    /* — iPad                                         */
  --theme-btn-padding-desktop: 5px;    /* — desktop                                      */
  --theme-icon-size-phone:     16px;   /* moon / sun icon size — phone                   */
  --theme-icon-size-ipad:      16px;   /* — iPad                                         */
  --theme-icon-size-desktop:   16px;   /* — desktop                                      */

  /* ── 1e. Action bar buttons (PDF, Excel, Load, Clear…) ── */
  --btn-font-size-phone:       0.55rem; /* button label text size — phone                */
  --btn-font-size-ipad:        0.55rem; /* — iPad                                        */
  --btn-font-size-desktop:     0.55rem; /* — desktop                                     */
  --btn-padding-phone:         5px 10px; /* space inside each button — phone             */
  --btn-padding-ipad:          5px 10px; /* — iPad                                       */
  --btn-padding-desktop:       5px 10px; /* — desktop                                    */
  --btn-min-height-phone:      30px;   /* minimum button height — phone                  */
  --btn-min-height-ipad:       30px;   /* — iPad                                         */
  --btn-min-height-desktop:    30px;   /* — desktop                                      */
  --btn-gap-phone:             4px;    /* gap between icon and label inside button — phone*/
  --btn-gap-ipad:              4px;    /* — iPad                                         */
  --btn-gap-desktop:           4px;    /* — desktop                                      */

  --section-dot-size-ipad:     4px;    /* — iPad                                         */
  --section-dot-size-desktop:  4px;    /* — desktop                                      */

  /* ╔══════════════════════════════════════════════╗
     ║  SECTION 2 — FONT SIZES                     ║
     ║  Controls how big text appears on screen     ║
     ║  and in PDF. Organized by device then        ║

  --fs-input-date:             0.7rem;   /* text inside date fields                      */
  --fs-textarea:               0.65rem;  /* text inside note boxes                       */
  --fs-placeholder:            0.65rem;  /* placeholder text inside inputs               */
  --fs-check-item:             0.5rem;   /* checkbox & radio option text                 */
  --fs-yn-label:               0.55rem;  /* Y / N toggle button text                     */
  --fs-footer:                 0.48rem;  /* footer confidential text on screen           */
  --fs-test-item-label:        0.5rem;   /* test grid labels (Voltage, CCA, SOH…)        */

  /* ── 2b. PDF — phone (base for all print) ── */

  --fs-print-doc-title:        1.05rem;  /* "Maintenance Report" in PDF                 */
  --fs-print-section-header:   0.52rem;  /* section title bars in PDF                   */
  --fs-print-label:            0.49rem;  /* field labels in PDF                         */
  --fs-print-field-label:      0.62rem;  /* field-row specific labels in PDF            */
  --fs-print-input:            0.62rem;  /* text inside inputs in PDF                   */
  --fs-print-textarea:         0.57rem;  /* text inside note boxes in PDF               */
  --fs-print-check-item:       0.47rem;  /* checkbox text in PDF                        */
  --fs-print-yn-label:         0.47rem;  /* Y / N button text in PDF                    */
  --fs-print-footer:           0.48rem;  /* footer text in PDF                          */

  /* ── 2c. PDF — macOS Safari ── */

  --fs-print-macos-doc-title:      1.05rem;
  --fs-print-macos-section-header: 0.52rem;

  --fs-print-macos-field-row:      0.49rem;  /* field row font size in macOS PDF        */

  --fs-print-ipad-doc-title:       1.05rem;
  --fs-print-ipad-section-header:  0.52rem;
  --fs-print-ipad-label:           0.57rem;  /* field labels in iPad PDF                */

  --fs-print-ipad-check-item:      0.47rem;
  --fs-print-ipad-yn-label:        0.47rem;
  --fs-print-ipad-footer:          0.48rem;

  /* ╔══════════════════════════════════════════════╗
     ║  SECTION 3 — PADDING                        ║
     ║  Controls breathing room inside elements.   ║
     ║  Format: top/bottom left/right              ║
     ╚══════════════════════════════════════════════╝ */

  /* ── 3a. Screen — all devices ── */

  --pd-input-date:          2px 3px;          /* inside date fields                      */

  --pd-check-item:          1px 5px 1px 3px;  /* checkbox & radio pill padding           */
  --pd-yn-label:            0 8px;            /* Y / N toggle button side padding        */
  --pd-footer:              12px 10px 4px 10px; /* footer bar                           */

  /* ── 3b. PDF — phone (base) ── */
  --pd-print-header:        5px 10px;         /* header bar in PDF                       */
  --pd-print-content:       3px 0;            /* outer margins in PDF                    */
  --pd-print-section-header:3px 7px;          /* section title bars in PDF              */
  --pd-print-section-body:  3px 6px;          /* section body padding in PDF            */
  --pd-print-input:         0 2px;            /* text inputs in PDF                      */
  --pd-print-textarea:      1px 3px;          /* note boxes in PDF                       */
  --pd-print-check-item:    1px 5px 1px 3px;  /* checkbox pills in PDF                  */
  --pd-print-yn-label:      0 5px;            /* Y / N buttons in PDF                    */
  --pd-print-footer:        4px 2px;          /* footer bar in PDF                       */

  /* ── 3c. PDF — macOS Safari ── */
  --pd-print-macos-header:  5px 10px;
  --pd-print-macos-footer:  4px 2px;
  --pd-print-macos-yn-label:0 5px;
  --pd-print-macos-page:    0px 4px 0px 4px;             /* full page padding for macOS PDF — top right bottom left   */

  /* ── 3d. PDF — iPhone Safari ── */
  --pd-print-ios-page:      0px 4px 0px 4px;             /* full page padding for iPhone PDF — top right bottom left  */

  /* ── 3e. PDF — iPad Safari ── */
  --pd-print-ipad-page:     0px 4px 0px 4px;             /* full page padding for iPad PDF — top right bottom left    */
  --pd-print-ipad-footer:   4px 2px;          /* footer bar in iPad PDF                  */

  /* ── 3f. PDF — Android Chrome ── */

  /* ╔══════════════════════════════════════════════╗

     ║  Controls how tall inputs, buttons, and     ║
     ║  note boxes are. Raise these when you raise ║

     ╚══════════════════════════════════════════════╝ */

  --h-input-date:           28px;   /* date inputs                                     */
  --h-check-item:           24px;   /* checkbox & radio pills                          */

  --h-phone-gennotes:       60px;   /* Generator notes text box — phone screen         */
  --h-phone-oilnotes:       50px;   /* Oil & Filter notes text box — phone screen      */
  --h-phone-gasnotes:       50px;   /* Gas system notes text box — phone screen        */

  --h-ipad-batnotes:        60px;
  --h-ipad-gennotes:        60px;
  --h-ipad-oilnotes:        50px;

  /* ── 4d. Screen — note boxes (desktop) ── */

  --h-desktop-gennotes:     60px;
  --h-desktop-oilnotes:     50px;
  --h-desktop-gasnotes:     50px;

  /* ── 4e. PDF — phone (base) ── */

  --h-print-yn-group:       18px;   /* Y / N group box in PDF                          */
  --h-print-yn-label:       18px;   /* Y / N button height in PDF                      */
  --h-print-batnotes:       62px;   /* Battery notes box in PDF                        */
  --h-print-gennotes:       62px;   /* Generator notes box in PDF                      */
  --h-print-oilnotes:       30px;   /* Oil & Filter notes box in PDF                   */
  --h-print-gasnotes:       30px;   /* Gas system notes box in PDF                     */

  --h-print-ios-oilnotes:   26px;   /* Oil, Gas & Transfer switch notes on iPhone PDF  */
  --h-print-ios-gasnotes:   26px;
  --h-print-ios-tsnotes:    26px;

  /* ── 4h. PDF — iPad Safari ── */
  --h-print-ipad-input:     16px;   /* text inputs in iPad PDF                         */
  --h-print-ipad-yn-group:  18px;   /* Y / N group box in iPad PDF                     */
  --h-print-ipad-batnotes:  62px;   /* Battery notes box in iPad PDF                   */
  --h-print-ipad-gennotes:  62px;   /* Generator notes box in iPad PDF                 */
  --h-print-ipad-oilnotes:  30px;   /* Oil & Filter notes box in iPad PDF              */
  --h-print-ipad-gasnotes:  30px;   /* Gas system notes box in iPad PDF                */
  --h-print-ipad-tsnotes:   30px;   /* Transfer switch notes box in iPad PDF           */

  /* ── 4i. PDF — Android Chrome ── */

  /* ╔══════════════════════════════════════════════╗
     ║  SECTION 5 — INPUT FIELD WIDTHS             ║
     ║  Controls how wide specific short inputs    ║
     ║  are. ch = character widths, px = pixels.   ║
     ╚══════════════════════════════════════════════╝ */

  /* ── 5a. Phone ── */
  --w-phone-tech:            165px;  /* Technician name input                           */
  --w-phone-model:           100px;  /* Generator model number input                    */
  --w-phone-serial:          100px;  /* Generator serial number input                   */
  --w-phone-hours:            60px;  /* Runtime hours input                             */
  --w-phone-dare:            135px;  /* Battery brand/manufacturer input                */
  --w-phone-filterpart:      135px;  /* Oil filter part number input                    */
  --w-phone-signal:           40px;  /* Cell signal strength input                      */

  /* ── 5b. iPad ── */
  --w-ipad-tech:             165px;
  --w-ipad-model:            100px;
  --w-ipad-serial:           100px;
  --w-ipad-hours:             60px;
  --w-ipad-dare:             135px;
  --w-ipad-filterpart:       135px;
  --w-ipad-signal:            40px;

  /* ── 5c. Desktop ── */
  --w-desktop-tech:          165px;
  --w-desktop-model:         100px;
  --w-desktop-serial:        100px;
  --w-desktop-hours:          60px;
  --w-desktop-dare:          135px;
  --w-desktop-filterpart:    135px;
  --w-desktop-signal:         40px;

  /* ╔══════════════════════════════════════════════╗
     ║  SECTION 6 — LABEL GAPS & MISC SPACING      ║
     ║  Small gaps between adjacent labels and      ║
     ║  fields that don't fit into padding.         ║

  --gap-desktop-genvolt:     12px;   /* — desktop                                       */

     ║  The confidential line at the bottom of      ║
     ║  the page. Kept separate for easy access.    ║
     ╚══════════════════════════════════════════════╝ */

  --fs-screen-footer:        0.48rem;  /* footer text on screen (all devices)           */
  --fs-print-footer-base:    0.48rem;  /* footer text in PDF — phone base               */
  --fs-print-macos-footer:   0.48rem;  /* footer text in macOS Safari PDF               */
  --bg: #0A0E27;
  --bg2: #0F1535;
  --bg3: #1A2847;
  --bg4: #243458;
  --panel: #0F1535;
  --panel2: #1A2847;
  --border: rgba(0,255,200,0.08);
  --border-bright: rgba(0,255,200,0.25);
  --text: #E0F7FF;
  --text-muted: #7DD3FC;
  --text-dim: #38BDF8;
  --cyan: #00FFC8;
  --cyan-dim: #06B6D4;
  --cyan-dark: #0891B2;
  --amber: #D97706;
  --amber-dim: #B45309;

  --icon-color-primary: #00FFC8;

}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  width: 100%;
  margin: 0 auto;
  padding: 0;
  padding-bottom: max(0px, env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  transition: background-color 0.3s ease, color 0.3s ease;
  min-height: -webkit-fill-available;
  min-height: 100vh;
}

body.dark-mode {
  background: linear-gradient(135deg,#0A0E27 0%,#0F1535 25%,#0A1628 50%,#0F1535 75%,#0A0E27 100%);
  background-attachment: fixed;
  background-size: 400% 400%;
}

.page {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  background: var(--panel);
  border: 2px solid var(--cyan);
  box-shadow: 0 0 0 1px rgba(217,119,6,0.1), 0 0 40px rgba(217,119,6,0.08), inset 0 0 60px rgba(255,255,255,0.8);
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: -webkit-fill-available;
  min-height: 100vh;
  padding: 0;
  box-sizing: border-box;
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
  flex-shrink: 0;
  overflow-x: hidden;
}

body.dark-mode .page {
  background: linear-gradient(135deg,rgba(15,21,53,0.95) 0%,rgba(10,14,39,0.98) 100%);
  border-color: #00FFC8;
  box-shadow: 0 0 1px rgba(0,255,200,0.3), 0 0 20px rgba(0,255,200,0.15), 0 0 40px rgba(59,130,246,0.08), inset 0 0 60px rgba(0,255,200,0.02);
}

.page::before, .page::after {
  content: '';
  position: absolute;
  width: var(--corner-size-phone); height: var(--corner-size-phone);
  border-color: var(--cyan);
  border-style: solid;
  z-index: 10;
}
.page::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.page::after  { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
.page-corner-bl, .page-corner-br {
  position: absolute;
  width: var(--corner-size-phone); height: var(--corner-size-phone);
  border-color: var(--cyan);
  border-style: solid;
  z-index: 10;
  pointer-events: none;
}
.page-corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
.page-corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

@media (max-width: 768px) {
  body { padding: 0; }
  .page { box-shadow: none; border: none; max-width: 100%; }
  .page::before, .page::after, .page-corner-bl, .page-corner-br { display: none; }
  .header { flex-wrap: nowrap; gap: 6px; padding: 6px 8px; min-height: auto; justify-content: space-between; }
  .header-logo { flex: 0 1 auto; min-width: 0; overflow: hidden; padding-left: 30px; }
  .logo-img { width: var(--logo-size-screen); height: var(--logo-size-screen); }
  .company-name { font-size: 0.75rem !important; letter-spacing: 0.5px !important; white-space: nowrap; }
  .doc-title { font-size: 0.75rem !important; letter-spacing: 1px !important; white-space: nowrap; }
}

/* ── HEADER ── */
.header {
  background: var(--panel);
  padding: var(--pd-header);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--header-gap-phone);
  border-bottom: 1px solid var(--border-bright);
  position: relative;
  overflow: hidden;
  min-height: var(--header-min-height-phone);
  page-break-after: avoid;
  break-after: avoid;
  margin: 0;
  flex-shrink: 0;
  transition: all 0.3s ease;
  width: 100%;
  box-sizing: border-box;
}

body.dark-mode .header {
  background: linear-gradient(90deg,rgba(15,21,53,0.9) 0%,rgba(26,40,71,0.8) 50%,rgba(15,21,53,0.9) 100%);
  border-bottom-color: rgba(0,255,200,0.25);
  box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 20px rgba(0,255,200,0.08), inset 0 1px 0 rgba(0,255,200,0.1);
}

.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--amber), var(--cyan), transparent);
}

body.dark-mode .header::after {
  background: linear-gradient(90deg, transparent, #00FFC8, #3B82F6, #00FFC8, transparent);
  opacity: 0.6;
}

.header-logo { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }

.logo-img {
  width: var(--logo-size-screen); height: var(--logo-size-screen);
  flex-shrink: 0;
  object-fit: contain;
  filter: drop-shadow(0 0 12px rgba(217,119,6,0.6)) drop-shadow(0 0 24px rgba(217,119,6,0.4)) brightness(1.1);
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%,100% { filter: drop-shadow(0 0 12px rgba(217,119,6,0.6)) drop-shadow(0 0 24px rgba(217,119,6,0.4)) brightness(1.1); }
  50%     { filter: drop-shadow(0 0 18px rgba(217,119,6,0.8)) drop-shadow(0 0 36px rgba(217,119,6,0.6)) brightness(1.2); }
}
body.dark-mode .logo-img {
  filter: drop-shadow(0 0 12px rgba(0,255,200,0.6)) drop-shadow(0 0 24px rgba(0,255,200,0.4)) brightness(1.1);
  animation: logoPulseDark 3s ease-in-out infinite;
}
@keyframes logoPulseDark {
  0%,100% { filter: drop-shadow(0 0 12px rgba(0,255,200,0.6)) drop-shadow(0 0 24px rgba(0,255,200,0.4)) brightness(1.1); }
  50%     { filter: drop-shadow(0 0 18px rgba(0,255,200,0.8)) drop-shadow(0 0 36px rgba(0,255,200,0.6)) brightness(1.2); }
}

.company-name {
  font-family: var(--font-display);
  font-size: var(--fs-company-name);
  color: var(--cyan);
  letter-spacing: 2px;
  line-height: 1.1;
  text-shadow: 0 0 12px rgba(217,119,6,0.2);
  font-weight: 700;
  transition: all 0.3s ease;
}
body.dark-mode .company-name {
  color: #00FFC8;
  text-shadow: 0 0 10px #00FFC8, 0 0 20px rgba(0,255,200,0.5), 0 0 30px rgba(59,130,246,0.3), 0 0 40px rgba(0,255,200,0.2);
  letter-spacing: 3px;
}

.doc-title {
  font-family: var(--font-display);
  font-size: var(--fs-doc-title);
  color: var(--amber);
  letter-spacing: 3px;
  text-shadow: 0 0 12px rgba(217,119,6,0.2);
  font-weight: 500;
  white-space: nowrap;
  transition: all 0.3s ease;
}
body.dark-mode .doc-title {
  color: #00FFC8 !important;
  text-shadow: 0 0 12px #00FFC8, 0 0 20px rgba(0,255,200,0.5), 0 0 30px rgba(0,255,200,0.3) !important;
  letter-spacing: 4px;
}

/* ── THEME TOGGLE ── */
.theme-toggle-btn {
  position: relative;
  width: var(--theme-btn-size-phone); height: var(--theme-btn-size-phone);
  padding: var(--theme-btn-padding-phone);
  border: 1px solid rgba(217,119,6,0.4);
  background: rgba(217,119,6,0.05);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cyan);
  transition: all 0.3s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  flex-shrink: 0;
  z-index: 100;
}
body.dark-mode .theme-toggle-btn { background: rgba(0,255,200,0.08); border-color: rgba(0,255,200,0.2); color: #00FFC8; }
.theme-toggle-btn:hover { border-color: var(--cyan); background: rgba(217,119,6,0.1); box-shadow: var(--glow); transform: scale(1.08); }
body.dark-mode .theme-toggle-btn:hover { background: rgba(0,255,200,0.12); border-color: #00FFC8; box-shadow: 0 0 12px rgba(0,255,200,0.3), inset 0 0 8px rgba(0,255,200,0.05); transform: scale(1.1); }
.theme-toggle-btn:active { transform: scale(0.95); }

.theme-icon {
  width: var(--theme-icon-size-phone); height: var(--theme-icon-size-phone);
  transition: all 0.3s ease;
  position: absolute;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke: var(--icon-color-primary) !important;
  color: var(--icon-color-primary) !important;
}
.theme-icon.theme-icon-moon { opacity: 0; }
body.dark-mode .theme-icon { opacity: 0; transform: rotate(-180deg); }
body.dark-mode .theme-icon.theme-icon-moon { opacity: 1; transform: rotate(0deg); }

/* ── TOOLBAR ── */
.toolbar { display: none !important; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--btn-gap-phone);
  padding: var(--btn-padding-phone);
  border: 1px solid rgba(217,119,6,0.4);
  background: rgba(217,119,6,0.05);
  font-family: var(--font-display);
  font-size: var(--btn-font-size-phone);
  font-weight: 500;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  cursor: pointer;
  color: var(--cyan);
  white-space: nowrap;
  min-height: var(--btn-min-height-phone);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: all 0.15s;
  clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
  position: relative;
  overflow: hidden;
}
body.dark-mode .btn { background: rgba(0,255,200,0.08); border-color: rgba(0,255,200,0.25); color: #00FFC8; text-shadow: 0 0 4px rgba(0,255,200,0.3); }
.btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: var(--glow); }
body.dark-mode .btn:hover { background: rgba(0,255,200,0.12); border-color: #00FFC8; box-shadow: 0 0 12px rgba(0,255,200,0.25), inset 0 0 12px rgba(0,255,200,0.05); text-shadow: 0 0 8px rgba(0,255,200,0.6); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* ── CONTENT ── */
.content {
  padding: var(--pd-content);
  display: flex;
  flex-direction: column;
  flex: 1;
  width: 100%;
  box-sizing: border-box;
  min-height: 0;
  overflow-y: auto;
}
@media (max-width: 480px) { .content { padding: 6px 4px; } }

/* ── SECTIONS ── */
.section {
  border: 1px solid var(--border);
  margin-bottom: var(--section-margin-phone);
  background: var(--panel);
  position: relative;
  transition: all 0.3s ease;
  page-break-inside: avoid;
  break-inside: avoid;
}
body.dark-mode .section {
  background: linear-gradient(135deg,rgba(26,40,71,0.6) 0%,rgba(15,21,53,0.8) 100%);
  border-color: rgba(0,255,200,0.15);
  box-shadow: 0 0 1px rgba(0,255,200,0.1), inset 0 0 20px rgba(0,255,200,0.02);
}
.section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--cyan), transparent 60%);
  transition: all 0.3s ease;
}
body.dark-mode .section::before {
  background: linear-gradient(90deg, #00FFC8, rgba(0,255,200,0.3) 40%, transparent 100%);
  opacity: 0.7;
}

.section-header {
  background: var(--bg3);
  color: var(--cyan);
  font-family: var(--font-display);
  font-size: var(--fs-section-header);
  letter-spacing: 2.5px;
  padding: var(--pd-section-header);
  border-bottom: 1px solid var(--border);
  text-shadow: 0 0 6px rgba(217,119,6,0.15);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: var(--section-gap-phone);
  transition: all 0.3s ease;
  text-transform: uppercase;
}
body.dark-mode .section-header {
  background: linear-gradient(90deg,rgba(26,40,71,0.8) 0%,rgba(36,52,88,0.6) 100%);
  color: #00FFC8;
  border-bottom-color: rgba(0,255,200,0.2);
  text-shadow: 0 0 8px rgba(0,255,200,0.4), 0 0 16px rgba(59,130,246,0.15);
}
.section-header::before {
  content: '';
  display: inline-block;
  width: var(--section-dot-size-phone); height: var(--section-dot-size-phone);
  background: var(--cyan);
  box-shadow: 0 0 4px var(--cyan);
  flex-shrink: 0;
  animation: pulse 2s ease-in-out infinite;
  transition: all 0.3s ease;
}
body.dark-mode .section-header::before { background: #00FFC8; box-shadow: 0 0 6px #00FFC8, 0 0 12px rgba(0,255,200,0.5); }
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.section-body { padding: var(--pd-section-body); transition: all 0.3s ease; }

/* ── TWO-COLUMN ── */
.two-column {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  width: 100%;
  margin-bottom: 4px;
}
.two-column .section { margin-bottom: 0; }
@media (max-width: 820px) {
  .two-column { grid-template-columns: 1fr; gap: 4px; margin-bottom: 4px; }
}

/* ── FIELD ROWS ── */
.field-row {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-bottom: 3px;
  flex-wrap: wrap;
}
.field-row:last-child { margin-bottom: 0; }

label {
  font-size: var(--fs-label);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
  line-height: 1;
  font-family: var(--font-display);
  transition: color 0.3s ease;
}
body.dark-mode label { color: #7DD3FC; }

/* ── INPUTS ── */
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="date"],
input[type="number"],
textarea,
select {
  font-family: var(--font-mono);
  font-size: var(--fs-input);
  color: var(--text);
  background: var(--panel);
  border: none;
  border-bottom: 1.5px solid rgba(217,119,6,0.25);
  padding: var(--pd-input);
  outline: none;
  width: 100%;
  transition: all 0.2s;
  border-radius: 0;
  min-height: var(--h-input);
  -webkit-appearance: none;
  appearance: none;
  caret-color: var(--cyan);
}
body.dark-mode input[type="text"],
body.dark-mode input[type="email"],
body.dark-mode input[type="tel"],
body.dark-mode input[type="date"],
body.dark-mode input[type="number"],
body.dark-mode textarea,
body.dark-mode select {
  background: rgba(10,14,39,0.6);
  border-bottom-color: rgba(0,255,200,0.2);
  color: #E0F7FF;
  caret-color: #00FFC8;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), inset 0 0 8px rgba(0,255,200,0.05);
}
input[type="date"] { min-height: var(--h-input-date); padding: var(--pd-input-date); cursor: pointer; color-scheme: light; }
body.dark-mode input[type="date"] { color-scheme: dark; }
input::placeholder, textarea::placeholder { color: var(--text-dim) !important; opacity: 0.4; font-size: var(--fs-placeholder); }

input[type="text"]:focus,
input[type="email"]:focus,
input[type="tel"]:focus,
input[type="date"]:focus,
input[type="number"]:focus,
textarea:focus,
select:focus {
  border-bottom-color: var(--cyan);
  background: rgba(217,119,6,0.04);
  box-shadow: 0 1px 0 0 rgba(217,119,6,0.3), 0 0 8px rgba(217,119,6,0.08);
}
body.dark-mode input[type="text"]:focus,
body.dark-mode input[type="email"]:focus,
body.dark-mode input[type="tel"]:focus,
body.dark-mode input[type="date"]:focus,
body.dark-mode input[type="number"]:focus,
body.dark-mode textarea:focus,
body.dark-mode select:focus {
  border-bottom-color: #00FFC8;
  background: rgba(26,40,71,0.8);
  box-shadow: inset 0 0 8px rgba(0,255,200,0.1), 0 0 8px rgba(0,255,200,0.15), 0 0 16px rgba(59,130,246,0.08);
}

input.short { width: 48px; min-width: 48px; flex-shrink: 0; }
input.med   { width: 80px; flex: 0 0 auto; }
input.long  { flex: 1; min-width: 70px; }

textarea {
  width: 100%;
  resize: vertical;
  border: 1px solid rgba(217,119,6,0.15);
  padding: var(--pd-textarea);
  margin-top: 1px;
  min-height: auto !important;
  max-height: none !important;
  background: var(--panel);
  color: var(--text);
  transition: all 0.3s ease;
  font-size: var(--fs-textarea);
  line-height: 1.2;
}
body.dark-mode textarea { background: rgba(10,14,39,0.6); border-color: rgba(0,255,200,0.1); color: #E0F7FF; }
textarea:focus { border-color: var(--cyan); box-shadow: 0 0 6px rgba(217,119,6,0.1); }
body.dark-mode textarea:focus { border-color: #00FFC8; box-shadow: 0 0 6px rgba(0,255,200,0.15); }

/* ── CHECK GROUPS ── */
.check-group {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  align-items: center;
  margin-top: 0;
  width: 100%;
}
.check-item {
  display: flex;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  user-select: none;
  min-height: var(--h-check-item);
  padding: var(--pd-check-item);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  border: 0.5px solid rgba(217,119,6,0.25);
  background: rgba(217,119,6,0.02);
  transition: all 0.15s;
  clip-path: polygon(3px 0%, 100% 0%, calc(100% - 3px) 100%, 0% 100%);
  font-size: var(--fs-check-item);
}
body.dark-mode .check-item { background: rgba(26,40,71,0.3); border-color: rgba(0,255,200,0.1); }
.check-item:hover { border-color: rgba(217,119,6,0.4); background: rgba(217,119,6,0.05); }
body.dark-mode .check-item:hover { background: rgba(36,52,88,0.4); border-color: rgba(0,255,200,0.2); box-shadow: 0 0 4px rgba(0,255,200,0.08); }
.check-item:has(input:checked) { background: transparent; border-color: #D97706; outline: 1.5px solid #D97706; box-shadow: 0 0 4px rgba(217,119,6,0.3); }
body.dark-mode .check-item:has(input:checked) { background: transparent; border-color: #00FFC8; outline: 1.5px solid #00FFC8; box-shadow: 0 0 6px rgba(0,255,200,0.3); }

.check-item input[type="checkbox"],
.check-item input[type="radio"] {
  width: 11px !important; height: 11px !important;
  min-height: 11px !important; min-width: 11px !important;
  accent-color: #D97706;
  cursor: pointer;
  flex-shrink: 0;
  border: none; border-bottom: none;
  padding: 0;
  background: none;
  transition: all 0.3s ease;
}
body.dark-mode .check-item input[type="checkbox"],
body.dark-mode .check-item input[type="radio"] { accent-color: #00FFC8; }

.check-item span {
  font-family: var(--font-display);
  font-size: var(--fs-check-item);
  font-weight: 500;
  letter-spacing: 0.6px;
  color: var(--text);
  text-transform: uppercase;
  transition: color 0.15s;
}
body.dark-mode .check-item span { color: #E0F7FF; }
.check-item:has(input:checked) span { color: #D97706; font-weight: bold; text-shadow: none; }
body.dark-mode .check-item:has(input:checked) span { color: #D97706; font-weight: bold; text-shadow: none; }

/* ── TEST GRID ── */
.test-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
  width: 100%;
}
.test-item { display: flex; align-items: center; gap: 8px; }
.test-item label { min-width: 75px; white-space: nowrap; }
@media (max-width: 768px) { .test-grid { grid-template-columns: 1fr; gap: 10px; } }

/* ── Y/N TOGGLE ── */
.yn-group {
  display: inline-flex;
  border: 0.5px solid rgba(217,119,6,0.25);
  overflow: visible;
  flex-shrink: 0;
  background: var(--panel);
  transition: all 0.3s ease;
  height: var(--h-yn-group);
  position: relative;
}
body.dark-mode .yn-group { background: rgba(15,21,53,0.7); border-color: rgba(0,255,200,0.1); }
.yn-group input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.yn-group .yn-label {
  padding: var(--pd-yn-label);
  font-family: var(--font-display);
  font-size: var(--fs-yn-label);
  font-weight: 600;
  letter-spacing: 1.2px;
  cursor: pointer;
  color: var(--text-muted);
  background: transparent;
  border: none;
  min-height: var(--h-yn-label);
  display: flex;
  align-items: center;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: all 0.15s;
}
body.dark-mode .yn-group .yn-label { color: #7DD3FC; }
.yn-group .yn-label:first-of-type { border-right: 0.5px solid rgba(217,119,6,0.15); }
body.dark-mode .yn-group .yn-label:first-of-type { border-right-color: rgba(0,255,200,0.08); }
.yn-group .yn-label:hover { background: rgba(217,119,6,0.05); color: var(--text); }
body.dark-mode .yn-group .yn-label:hover { background: rgba(0,255,200,0.04); color: #E0F7FF; }
.yn-group .yn-y:checked + .yn-label-y { background: #059669; color: #fff; text-shadow: none; box-shadow: inset 0 0 6px rgba(0,0,0,0.15); }
.yn-group .yn-n:checked + .yn-label-n { background: #DC2626; color: #fff; text-shadow: none; box-shadow: inset 0 0 6px rgba(0,0,0,0.15); }
body.dark-mode .yn-group .yn-y:checked + .yn-label-y { background: #059669; color: #fff; text-shadow: none; box-shadow: 0 0 8px rgba(5,150,105,0.4); }
body.dark-mode .yn-group .yn-n:checked + .yn-label-n { background: #DC2626; color: #fff; text-shadow: none; box-shadow: 0 0 8px rgba(220,38,38,0.4); }

/* ── FOOTER ── */
.footer {
  background: var(--panel);
  padding: var(--pd-footer);
  padding-bottom: max(4px, env(safe-area-inset-bottom, 4px));
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  border-top: 1px solid var(--border-bright);
  margin-top: auto;
  flex-shrink: 0;
  transition: all 0.3s ease;
  width: 100%;
  box-sizing: border-box;
  min-height: auto;
}
body.dark-mode .footer {
  background: linear-gradient(90deg,rgba(15,21,53,0.8) 0%,rgba(26,40,71,0.6) 100%);
  border-top-color: rgba(0,255,200,0.15);
  box-shadow: 0 -2px 6px rgba(0,0,0,0.3);
}
.footer-text {
  font-family: var(--font-display);
  font-size: var(--fs-footer);
  color: var(--text-dim);
  letter-spacing: 1.5px;
  transition: color 0.3s ease;
}
body.dark-mode .footer-text { color: #7DD3FC; text-shadow: 0 0 4px rgba(0,255,200,0.15); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(217,119,6,0.3); border-radius: 0; }
::-webkit-scrollbar-thumb:hover { background: var(--cyan-dim); }
body.dark-mode::-webkit-scrollbar { width: 6px; }
body.dark-mode::-webkit-scrollbar-track { background: rgba(10,14,39,0.5); border-radius: 3px; }
body.dark-mode::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#00FFC8 0%,#3B82F6 100%); border-radius: 3px; box-shadow: 0 0 6px rgba(0,255,200,0.3); }
body.dark-mode::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg,#00FFE8 0%,#60A5FA 100%); box-shadow: 0 0 10px rgba(0,255,200,0.5); }

/* ══════════════════════════════════════════════════════════════
   PRINT STYLES
   ══════════════════════════════════════════════════════════════ */
@media print {
  @page { size: 8.5in 11in; margin: 0 !important; }

  html {
    height: auto !important; margin: 0 !important; padding: 0 !important;
    overflow: visible !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body {
    height: auto !important; min-height: 0 !important;
    margin: 0 !important; padding: 0 !important;
    overflow: visible !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  *, *::before, *::after { animation: none !important; transition: none !important; color-scheme: light !important; }

  /* iOS */

  var isIOS      = /iP(hone|od|ad)/.test(ua) && /WebKit/.test(ua) && !isCriOS; // Safari on iOS only
  var isIPad     = /iPad/.test(ua) || (/Macintosh/.test(ua) && /Safari/.test(ua) && !(/Chrome/.test(ua)) && navigator.maxTouchPoints > 1); // iPad (including iPadOS 13+)
  var isMacOS    = /Macintosh/.test(ua) && /Safari/.test(ua) && !/Chrome/.test(ua) && navigator.maxTouchPoints === 0;
  var isWindows  = /Windows/.test(ua);
  var isAndroid  = /Android/.test(ua);
  var isMobileChrome = isCriOS || (isAndroid && /Chrome/.test(ua) && !/Edg/.test(ua));

  if (isIOS)          html.classList.add('ios', 'mobile-safari');
  if (isIPad)         html.classList.add('ios', 'mobile-safari', 'ipad-safari');
  if (isCriOS)        html.classList.add('ios');
  if (isMacOS)        html.classList.add('macos');
  if (isWindows)      html.classList.add('windows');
  if (isAndroid)      html.classList.add('android');
  if (isMobileChrome) html.classList.add('mobile-chrome');

  function applyToBody() {
    if (isIOS)          document.body.classList.add('ios', 'mobile-safari');
    if (isIPad)         document.body.classList.add('ios', 'mobile-safari', 'ipad-safari');
    if (isCriOS)        document.body.classList.add('ios');
    if (isMacOS)        document.body.classList.add('macos');
    if (isWindows)      document.body.classList.add('windows');
    if (isAndroid)      document.body.classList.add('android');
    if (isMobileChrome) document.body.classList.add('mobile-chrome');
  }
  if (document.body) applyToBody();
  else document.addEventListener('DOMContentLoaded', applyToBody);
})();
</script>

<script>
const THEME_KEY = 'aog_maint_theme';
const DRAFT_KEY = 'aog_maint_draft';

function getInitialTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) return saved;
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  return 'light';
}

function applyTheme(theme) {
  if (theme === 'dark') document.body.classList.add('dark-mode');
  else document.body.classList.remove('dark-mode');
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}

function toggleTheme() {
  applyTheme(document.body.classList.contains('dark-mode') ? 'light' : 'dark');
}

function setupThemeToggle() {
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.addEventListener('click', toggleTheme);
}

function saveDraft() {
  const data = {};
  document.querySelectorAll('input, textarea').forEach(el => {
    const key = el.id || el.name;
    if (!key) return;
    if (el.type === 'checkbox') {
      if (!data[key]) data[key] = [];
      if (el.checked) data[key].push(el.value);
    } else if (el.type === 'radio') {
      if (el.checked) data[key] = el.value;
    } else {
      if (data[key] === undefined) data[key] = el.value;
    }
  });
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (e) {}
}

function restoreDraft() {
  const saved = localStorage.getItem(DRAFT_KEY);
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    document.querySelectorAll('input, textarea').forEach(el => {
      const key = el.id || el.name;
      if (!key || data[key] === undefined) return;
      if (el.type === 'checkbox') {
        if (Array.isArray(data[key])) el.checked = data[key].includes(el.value);
      } else if (el.type === 'radio') {
        if (el.value === data[key]) el.checked = true;
      } else {
        el.value = data[key];
      }
    });
  } catch (e) {}
}

// ── SAVE AS EXCEL ──
function saveAsExcel() {
  if (typeof XLSX === 'undefined') {
    setStatus('Excel library not loaded — try refreshing.');
    setTimeout(function() { setStatus(''); }, 5000);
    return;
  }
  saveDraft();
  var rows = [['field_id', 'Field', 'Value']];

  // Text / number / date inputs + textareas
  document.querySelectorAll('input[type="text"],input[type="number"],input[type="date"],textarea').forEach(function(el) {
    var key = el.id || el.name; if (!key || !el.value) return;
    rows.push([key, FIELD_LABELS[key] || key, el.value]);
  });

  // Radio buttons
  var radioGroups = {};
  document.querySelectorAll('input[type="radio"]').forEach(function(el) {
    if (el.checked) radioGroups[el.name] = el.value;
  });
  Object.keys(radioGroups).forEach(function(name) {
    rows.push([name, FIELD_LABELS[name] || name, radioGroups[name]]);
  });

  // Checkboxes
  var checkGroups = {};
  document.querySelectorAll('input[type="checkbox"]').forEach(function(el) {
    if (!el.name) return;
    if (!checkGroups[el.name]) checkGroups[el.name] = [];
    if (el.checked) checkGroups[el.name].push(el.value);
  });
  Object.keys(checkGroups).forEach(function(name) {
    if (!checkGroups[name].length) return;
    rows.push([name, FIELD_LABELS[name] || name, checkGroups[name].join(', ')]);
  });

  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 20 }, { wch: 28 }, { wch: 48 }];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Maintenance');

  var custName = ((document.getElementById('name') || {}).value || '').trim();
  var jobNum   = ((document.getElementById('number') || {}).value || '').trim();
  var parts = [];
  if (custName) parts.push(custName);
  if (jobNum)   parts.push('Job ' + jobNum);
  parts.push('Maintenance');
  var slug = parts.join(' - ').replace(/[\/\:*?"<>|]/g, '').replace(/\s{2,}/g, ' ').trim();
  XLSX.writeFile(wb, slug + '.xlsx');
  setStatus('Excel saved: ' + slug + '.xlsx');
  setTimeout(function() { setStatus(''); }, 4000);
}

// ── LOAD DRAFT FILE (Excel or JSON) ──
function loadDraftFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var isExcel = /\.xlsx$/i.test(file.name);

  if (isExcel) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        if (typeof XLSX === 'undefined') { setStatus('Excel library not loaded.'); return; }
        var wb   = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        var ws   = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
        var data = {};
        rows.forEach(function(row, i) {
          if (i === 0 || !row || row.length < 2) return;
          var key = String(row[0] || '').trim();
          var val = row.length >= 3
            ? (row[2] !== undefined ? String(row[2]) : '')
            : (row[1] !== undefined ? String(row[1]) : '');
          if (!key || key === 'field_id' || key === 'Field') return;
          if (val.indexOf(',') !== -1) {
            data[key] = val.split(',').map(function(v) { return v.trim(); }).filter(Boolean);
          } else {
            data[key] = val;
          }
        });
        applyFormData(data);
        saveDraft();
        setStatus('Excel loaded: ' + file.name);
        setTimeout(function() { setStatus(''); }, 4000);
      } catch(err) {
        setStatus('Error loading Excel — file may be invalid.');
        setTimeout(function() { setStatus(''); }, 5000);
      }
      input.value = '';
    };
    reader.readAsArrayBuffer(file);
  } else {
    var reader2 = new FileReader();
    reader2.onload = function(e) {
      try {
        var data = JSON.parse(e.target.result);
        applyFormData(data);
        saveDraft();
        setStatus('Draft loaded: ' + file.name);
        setTimeout(function() { setStatus(''); }, 4000);
      } catch(err) {
        setStatus('Error loading draft.');
        setTimeout(function() { setStatus(''); }, 5000);
      }
      input.value = '';
    };
    reader2.readAsText(file);
  }
}

// ── APPLY FORM DATA ──
function applyFormData(data) {
  document.querySelectorAll('input, textarea').forEach(function(el) {
    var key = el.id || el.name;
    if (!key || data[key] === undefined) return;
    try {
      if (el.type === 'checkbox') {
        var vals = Array.isArray(data[key]) ? data[key] : String(data[key]).split(',').map(function(v){return v.trim();});
        el.checked = vals.indexOf(el.value) !== -1;
      } else if (el.type === 'radio') {
        el.checked = typeof data[key] === 'string' && el.value === data[key];
      } else {
        el.value = data[key];
      }
    } catch(e) {}
  });
}

function clearForm() {
  if (!confirm('Clear all fields?')) return;
  document.querySelectorAll('input[type="text"], input[type="date"], input[type="number"], textarea').forEach(el => el.value = '');
  document.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(el => el.checked = false);
  localStorage.removeItem(DRAFT_KEY);
}

function openPrintPreview() {
  const wasDark = document.body.classList.contains('dark-mode');
  const isMacOS = document.documentElement.classList.contains('macos');
  if (wasDark) document.body.classList.remove('dark-mode');

  // ── macOS Safari fast path ────────────────────────────────────────────
  // afterprint fires BEFORE the job reaches the printer on macOS Safari,
  // so JS stamp + restore causes the actual printout to differ from the
  // preview. Solution: skip all JS stamping and let the CSS @media print
  // html.macos rules handle everything. No stamps = no restore race.
  if (isMacOS) {
    const fixEl = document.createElement('style');
    fixEl.id = 'safari-print-height-fix';
    fixEl.textContent = [
      '.page, #page { min-height: 0 !important; height: auto !important; max-height: none !important; overflow: visible !important; display: block !important; margin-top: 0 !important; }',
      'html, body { height: auto !important; min-height: 0 !important; overflow: visible !important; }'
    ].join('\n');
    document.head.appendChild(fixEl);

    function macRestore() {
      if (wasDark) document.body.classList.add('dark-mode');
      const el = document.getElementById('safari-print-height-fix');
      if (el) el.remove();
      window.removeEventListener('afterprint', macRestore);
    }
    window.addEventListener('afterprint', macRestore);

    void document.body.offsetHeight;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        setTimeout(() => { window.print(); }, 400);
      });
    });
    return;
  }

  // ── All other browsers: JS stamp approach ─────────────────────────────
  const origMaxWidth = document.body.style.maxWidth;
  const origWidth    = document.body.style.width;
  document.body.style.maxWidth = '100%';
  document.body.style.width    = '100%';

  const _saved = [];
  function stamp(el, props) {
    _saved.push([el, el.getAttribute('style') || null]);
    for (const [k, v] of Object.entries(props)) el.style.setProperty(k, v, 'important');
  }

  function forceLightMode() {
    stamp(document.documentElement, { background: '#ffffff', 'background-color': '#ffffff', 'color-scheme': 'light' });
    stamp(document.body,            { background: '#ffffff', 'background-color': '#ffffff', 'color-scheme': 'light' });

    document.querySelectorAll('.action-bar, .toolbar, #action-bar, #save-status').forEach(el => stamp(el, {
      display: 'none', position: 'static', height: '0', 'min-height': '0',
      padding: '0', margin: '0', border: 'none', 'box-shadow': 'none',
      overflow: 'hidden', background: 'transparent', 'background-color': 'transparent'
    }));

    document.querySelectorAll('.page, #page').forEach(el => stamp(el, {
      background: '#ffffff', 'background-color': '#ffffff', 'color-scheme': 'light',
      'min-height': '0', height: 'auto', 'max-height': 'none',
      overflow: 'visible', display: 'block',
      flex: 'none', 'flex-direction': 'unset', 'flex-shrink': 'unset',
      'margin-top': '0'
    }));

    document.querySelectorAll('.content').forEach(el => stamp(el, {
      display: 'block', flex: 'none', 'flex-grow': 'unset'
    }));

    document.querySelectorAll('.footer').forEach(el => stamp(el, {
      display: 'flex', 'justify-content': 'space-between', 'align-items': 'center',
      flex: 'none', 'margin-top': '8px', 'margin-bottom': '0', width: '100%'
    }));

    stamp(document.documentElement, {
      height: 'auto', 'min-height': '0', 'max-height': 'none',
      overflow: 'visible', padding: '0', margin: '0'
    });

    stamp(document.body, {
      height: 'auto', 'min-height': '0', 'max-height': 'none',
      overflow: 'visible', padding: '0', margin: '0'
    });

    document.querySelectorAll('.section, .section-header, .form-row, .form-group, .header, .content').forEach(el =>
      stamp(el, { background: '#ffffff', 'background-color': '#ffffff', 'color-scheme': 'light' })
    );

    document.querySelectorAll('.footer').forEach(el =>
      stamp(el, { background: '#ffffff', 'background-color': '#ffffff', 'color-scheme': 'light' })
    );

    document.querySelectorAll(
      'input[type="text"], input[type="email"], input[type="tel"], input[type="date"], input[type="number"], textarea, select'
    ).forEach(el => stamp(el, {
      background: '#ffffff', 'background-color': '#ffffff',
      color: '#1F2937', '-webkit-text-fill-color': '#1F2937',
      'box-shadow': 'none', '-webkit-appearance': 'none', 'color-scheme': 'light'
    }));

    document.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(el => {
      _saved.push([el, el.getAttribute('style') || null]);
      el.style.setProperty('color-scheme', 'light', 'important');
    });

    document.querySelectorAll('table th').forEach(el => stamp(el, {
      background: '#4B5563', 'background-color': '#4B5563',
      color: '#ffffff', '-webkit-text-fill-color': '#ffffff', 'color-scheme': 'light'
    }));
    document.querySelectorAll('table td').forEach(el => {
      const bg = el.classList.contains('row-label') ? '#f0f0f0' : '#ffffff';
      stamp(el, { background: bg, 'background-color': bg,
        color: '#1F2937', '-webkit-text-fill-color': '#1F2937', 'color-scheme': 'light' });
    });
  }

  function restoreAll() {
    _saved.slice().reverse().forEach(([el, orig]) => {
      if (orig !== null) el.setAttribute('style', orig);
      else el.removeAttribute('style');
    });
    _saved.length = 0;
  }

  let restored = false;
  function restore() {
    if (restored) return;
    restored = true;
    restoreAll();
    if (wasDark) document.body.classList.add('dark-mode');
    document.body.style.maxWidth = origMaxWidth;
    document.body.style.width    = origWidth;
    const fixEl = document.getElementById('safari-print-height-fix');
    if (fixEl) fixEl.remove();
    window.removeEventListener('afterprint', restore);
    if (mql && mql.removeEventListener) mql.removeEventListener('change', onMqlChange);
  }

  window.addEventListener('afterprint', restore);
  const mql = window.matchMedia ? window.matchMedia('print') : null;
  function onMqlChange(e) { if (!e.matches) restore(); }
  if (mql && mql.addEventListener) mql.addEventListener('change', onMqlChange);

  const _printStyleEl = document.createElement('style');
  _printStyleEl.id = 'safari-print-height-fix';
  _printStyleEl.textContent = [
    '.page, #page { min-height: 0 !important; height: auto !important; max-height: none !important; overflow: visible !important; display: block !important; margin-top: 0 !important; }',
    'html, body { height: auto !important; min-height: 0 !important; overflow: visible !important; }'
  ].join('\n');
  document.head.appendChild(_printStyleEl);

  void document.body.offsetHeight;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        forceLightMode();
        void document.body.offsetHeight;
        setTimeout(() => {
          window.print();
          const el = document.getElementById('safari-print-height-fix');
          if (el) el.remove();
        }, 600);
      }, 600);
    });
  });
}

function setStatus(msg) {

function capturePageToCanvas() {
  return new Promise((resolve, reject) => {
    const page        = document.getElementById('page');
    const logoImg     = page.querySelector('.logo-img');
    const logoOrigSrc = logoImg ? logoImg.getAttribute('src') : null;

    const CAPTURE_WIDTH = 1050;
    const PAPER_RATIO   = 11 / 8.5;

    function doCapture() {
      const prevWidth     = page.style.width;
      const prevMaxWidth  = page.style.maxWidth;
      const prevMarginTop = page.style.marginTop;
      const prevBodyPad   = document.body.style.padding;

      page.style.width     = CAPTURE_WIDTH + 'px';
      page.style.maxWidth  = CAPTURE_WIDTH + 'px';
      page.style.marginTop = '0';
      document.body.style.padding = '0';

      const forceStyle = document.createElement('style');
      forceStyle.id = 'capture-force-style';
      forceStyle.textContent = [
        '.two-column { display: grid !important; grid-template-columns: 1fr 1fr !important; }',
        '.toolbar, .action-bar, #action-bar, #save-status {',
        '  display: none !important; position: static !important;',
        '  height: 0 !important; padding: 0 !important; overflow: hidden !important;',
        '}',
        '.theme-toggle-btn { display: none !important; }'
      ].join('\n');
      document.head.appendChild(forceStyle);

      function restoreCapture() {
        page.style.width     = prevWidth;
        page.style.maxWidth  = prevMaxWidth;
        page.style.marginTop = prevMarginTop;
        document.body.style.padding = prevBodyPad;
        const fs = document.getElementById('capture-force-style');
        if (fs) fs.remove();
        if (logoImg && logoOrigSrc) {
          logoImg.src = logoOrigSrc;
          logoImg.style.visibility = '';
        }
      }

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          html2canvas(page, {
            scale: 2,
            useCORS: true,
            allowTaint: true,   // render even if a resource is cross-origin
            backgroundColor: '#ffffff',
            logging: false,
            width:       CAPTURE_WIDTH,
            height:      page.scrollHeight,
            windowWidth: CAPTURE_WIDTH,
            scrollX: 0,
            scrollY: 0,
            ignoreElements: el =>
              el.classList.contains('toolbar')         ||
              el.classList.contains('action-bar')      ||
              el.id === 'action-bar'                   ||
              el.id === 'save-status'                  ||
              el.classList.contains('theme-toggle-btn')
          }).then(srcCanvas => {
            restoreCapture();
            const LETTER_W = 1632;
            const LETTER_H = Math.round(LETTER_W * PAPER_RATIO);
            const letterCanvas = document.createElement('canvas');
            letterCanvas.width  = LETTER_W;
            letterCanvas.height = LETTER_H;
            const ctx = letterCanvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, LETTER_W, LETTER_H);
            const scale   = LETTER_W / srcCanvas.width;
            const scaledH = Math.round(srcCanvas.height * scale);
            const drawH   = Math.min(scaledH, LETTER_H);
            ctx.drawImage(srcCanvas, 0, 0, srcCanvas.width, srcCanvas.height, 0, 0, LETTER_W, drawH);
            resolve(letterCanvas);
          }).catch(err => {
            restoreCapture();
            reject(err);
          });
        });
      });
    }

    // Pre-fetch the logo as a data URL so the canvas is never tainted
    // by a cross-origin resource (fixes macOS Safari SecurityError).
    // Falls back to hiding the logo if fetch fails for any reason.
    if (logoImg && logoOrigSrc) {
      fetch(logoOrigSrc)
        .then(r => r.blob())
        .then(blob => new Promise((res, rej) => {
          const fr = new FileReader();
          fr.onload  = () => res(fr.result);
          fr.onerror = rej;
          fr.readAsDataURL(blob);
        }))
        .then(dataUrl => {
          logoImg.src = dataUrl;       // inline data URL — no CORS issue
          setTimeout(doCapture, 150);  // brief delay for img repaint
        })
        .catch(() => {
          logoImg.style.visibility = 'hidden'; // hide if fetch fails
          doCapture();
        });
    } else {
      doCapture();
    }
  });
}
