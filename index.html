<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Lets it open full screen, like an app, when added to the iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AOG Test">
  <meta name="theme-color" content="#000000">
  <title>AOG Test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

    /* The innocent-looking screen people see first */
    #cover {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #111; color: #fff; font-family: system-ui, -apple-system, sans-serif; text-align: center;
      padding: 16px;
    }
    #cover h1 { font-size: 28px; margin: 0; }
    #cover .btn {
      font-size: 18px; font-weight: 600; padding: 14px 32px; border-radius: 999px;
      background: #f5a623; color: #111;
    }

    /* The player sits on top of the cover, nearly invisible, so the tap on
       "Tap to continue" actually lands on the video and starts it WITH sound. */
    #player {
      position: fixed; inset: 0; z-index: 2; width: 100%; height: 100%; border: 0;
      opacity: 0.01;
    }
    body.playing #player { opacity: 1; }
    body.playing #cover { display: none; }
  </style>
</head>
<body>
  <div id="cover">
    <h1>AOG Test</h1>
    <div class="btn">Tap to continue</div>
  </div>

  <iframe
    id="player"
    title="Video"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen></iframe>

  <script>
    // iPhones only allow sound when the person taps the video itself, so this
    // page does not autoplay. The first tap anywhere starts the video with sound.
    var frame = document.getElementById('player');
    var revealed = false;

    frame.src = 'https://player.vimeo.com/video/545391922' +
      '?playsinline=1&loop=1&title=0&byline=0&portrait=0&dnt=1';

    function reveal() {
      if (revealed) return;
      revealed = true;
      document.body.classList.add('playing');
    }

    // Ask the player to tell us when it starts playing.
    function subscribe() {
      if (!frame.contentWindow) return;
      ['play', 'playing', 'timeupdate'].forEach(function (name) {
        frame.contentWindow.postMessage(
          JSON.stringify({ method: 'addEventListener', value: name }),
          'https://player.vimeo.com');
      });
    }
    frame.addEventListener('load', subscribe);

    window.addEventListener('message', function (e) {
      if (e.origin !== 'https://player.vimeo.com') return;
      var data = e.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (err) { return; }
      }
      if (!data) return;
      if (data.event === 'ready') subscribe();
      if (data.event === 'play' || data.event === 'playing' ||
          data.event === 'playProgress' || data.event === 'timeupdate') reveal();
    });

    // Backups in case the player never reports in: a tap on the video moves
    // focus into it, which we can notice from out here.
    window.addEventListener('blur', function () {
      if (document.activeElement === frame) reveal();
    });
    setInterval(function () {
      if (document.activeElement === frame) reveal();
    }, 250);
  </script>
</body>
</html>
